<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Night fireworks over a castle 夜晚城堡上空的煙花">
  <title>Night fireworks over a castle</title>
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1140"/>
      <stop offset="70%" stop-color="#2b2a6e"/>
      <stop offset="100%" stop-color="#5a4f9c"/>
    </linearGradient>
  </defs>

  <!-- 夜空 Night sky -->
  <rect width="800" height="400" fill="url(#nsky)"/>

  <!-- 星星 Stars -->
  <g fill="#ffffff">
    <circle cx="46" cy="36" r="2"/>
    <circle cx="110" cy="90" r="1.6"/>
    <circle cx="196" cy="40" r="2.2"/>
    <circle cx="300" cy="26" r="1.8"/>
    <circle cx="420" cy="20" r="2"/>
    <circle cx="540" cy="34" r="1.6"/>
    <circle cx="640" cy="18" r="2.2"/>
    <circle cx="742" cy="44" r="1.8"/>
    <circle cx="770" cy="110" r="2"/>
  </g>

  <!-- 大煙花 Big firework（金色） -->
  <g stroke="#ffd166" stroke-width="4" stroke-linecap="round">
    <line x1="180" y1="150" x2="180" y2="96"/>
    <line x1="180" y1="150" x2="218" y2="112"/>
    <line x1="180" y1="150" x2="234" y2="150"/>
    <line x1="180" y1="150" x2="218" y2="188"/>
    <line x1="180" y1="150" x2="180" y2="204"/>
    <line x1="180" y1="150" x2="142" y2="188"/>
    <line x1="180" y1="150" x2="126" y2="150"/>
    <line x1="180" y1="150" x2="142" y2="112"/>
  </g>
  <g fill="#ffd166">
    <circle cx="180" cy="96" r="4"/>
    <circle cx="234" cy="150" r="4"/>
    <circle cx="180" cy="204" r="4"/>
    <circle cx="126" cy="150" r="4"/>
  </g>

  <!-- 大煙花 Big firework（粉紅） -->
  <g stroke="#ff8ab5" stroke-width="4" stroke-linecap="round">
    <line x1="620" y1="130" x2="620" y2="76"/>
    <line x1="620" y1="130" x2="658" y2="92"/>
    <line x1="620" y1="130" x2="674" y2="130"/>
    <line x1="620" y1="130" x2="658" y2="168"/>
    <line x1="620" y1="130" x2="620" y2="184"/>
    <line x1="620" y1="130" x2="582" y2="168"/>
    <line x1="620" y1="130" x2="566" y2="130"/>
    <line x1="620" y1="130" x2="582" y2="92"/>
  </g>
  <g fill="#ff8ab5">
    <circle cx="620" cy="76" r="4"/>
    <circle cx="674" cy="130" r="4"/>
    <circle cx="620" cy="184" r="4"/>
    <circle cx="566" cy="130" r="4"/>
  </g>

  <!-- 小煙花 Small firework（藍色） -->
  <g stroke="#8be9fd" stroke-width="3" stroke-linecap="round">
    <line x1="410" y1="80" x2="410" y2="48"/>
    <line x1="410" y1="80" x2="434" y2="62"/>
    <line x1="410" y1="80" x2="442" y2="80"/>
    <line x1="410" y1="80" x2="434" y2="98"/>
    <line x1="410" y1="80" x2="410" y2="112"/>
    <line x1="410" y1="80" x2="386" y2="98"/>
    <line x1="410" y1="80" x2="378" y2="80"/>
    <line x1="410" y1="80" x2="386" y2="62"/>
  </g>

  <!-- 城堡剪影 Castle silhouette -->
  <g fill="#1b1f4d">
    <rect x="330" y="250" width="140" height="110"/>
    <rect x="270" y="270" width="60" height="90"/>
    <rect x="470" y="270" width="60" height="90"/>
    <rect x="250" y="300" width="40" height="60"/>
    <rect x="510" y="300" width="40" height="60"/>
    <polygon points="330,252 400,180 470,252"/>
    <polygon points="270,272 300,224 330,272"/>
    <polygon points="470,272 500,224 530,272"/>
    <polygon points="250,302 270,268 290,302"/>
    <polygon points="510,302 530,268 550,302"/>
    <line x1="400" y1="180" x2="400" y2="152" stroke="#1b1f4d" stroke-width="6"/>
  </g>
  <g fill="#ffe08a">
    <rect x="384" y="300" width="32" height="60"/>
    <circle cx="300" cy="300" r="6"/>
    <circle cx="500" cy="300" r="6"/>
    <circle cx="270" cy="320" r="4"/>
    <circle cx="530" cy="320" r="4"/>
  </g>

  <!-- 地面 Ground -->
  <rect x="0" y="360" width="800" height="40" fill="#131735"/>
</svg>