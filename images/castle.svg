<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Cartoon castle with fireworks 卡通城堡與煙花">
  <title>Cartoon castle with fireworks</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1e5c"/>
      <stop offset="55%" stop-color="#4b4bd0"/>
      <stop offset="100%" stop-color="#a8b8ff"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd6f7"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ee7ff"/>
      <stop offset="100%" stop-color="#3f8fe0"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa76d"/>
      <stop offset="100%" stop-color="#1f6b46"/>
    </linearGradient>
  </defs>

  <!-- 天空 Sky -->
  <rect width="800" height="400" fill="url(#sky)"/>

  <!-- 星星 Stars -->
  <g fill="#fff8d0">
    <circle cx="60" cy="40" r="2"/>
    <circle cx="130" cy="80" r="2.5"/>
    <circle cx="210" cy="45" r="2"/>
    <circle cx="300" cy="28" r="2"/>
    <circle cx="430" cy="52" r="2"/>
    <circle cx="520" cy="34" r="2.5"/>
    <circle cx="610" cy="72" r="2"/>
    <circle cx="700" cy="40" r="2.5"/>
    <circle cx="762" cy="96" r="2"/>
  </g>

  <!-- 煙花 Fireworks -->
  <g stroke="#ffd166" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="120" x2="120" y2="88"/>
    <line x1="120" y1="120" x2="143" y2="97"/>
    <line x1="120" y1="120" x2="152" y2="120"/>
    <line x1="120" y1="120" x2="143" y2="143"/>
    <line x1="120" y1="120" x2="120" y2="152"/>
    <line x1="120" y1="120" x2="97" y2="143"/>
    <line x1="120" y1="120" x2="88" y2="120"/>
    <line x1="120" y1="120" x2="97" y2="97"/>
  </g>
  <g fill="#ff9ec4">
    <circle cx="120" cy="88" r="3"/>
    <circle cx="152" cy="120" r="3"/>
    <circle cx="120" cy="152" r="3"/>
    <circle cx="88" cy="120" r="3"/>
  </g>
  <g stroke="#8be9fd" stroke-width="3" stroke-linecap="round">
    <line x1="690" y1="140" x2="690" y2="112"/>
    <line x1="690" y1="140" x2="710" y2="120"/>
    <line x1="690" y1="140" x2="718" y2="140"/>
    <line x1="690" y1="140" x2="710" y2="160"/>
    <line x1="690" y1="140" x2="690" y2="168"/>
    <line x1="690" y1="140" x2="670" y2="160"/>
    <line x1="690" y1="140" x2="662" y2="140"/>
    <line x1="690" y1="140" x2="670" y2="120"/>
  </g>

  <!-- 草地 Ground -->
  <rect x="0" y="320" width="800" height="80" fill="url(#grass)"/>

  <!-- 樹 Trees -->
  <rect x="84" y="300" width="12" height="40" fill="#6b4a2b"/>
  <circle cx="90" cy="290" r="28" fill="#2f8f5b"/>
  <rect x="700" y="305" width="12" height="35" fill="#6b4a2b"/>
  <circle cx="706" cy="296" r="24" fill="#2f8f5b"/>

  <!-- 城堡 Castle（自己畫，唔係官方圖案 my own drawing） -->
  <g>
    <!-- 外側左塔 Outer left tower -->
    <rect x="190" y="190" width="50" height="130" fill="url(#wall)"/>
    <polygon points="182,192 215,140 248,192" fill="url(#roof)"/>
    <circle cx="215" cy="230" r="8" fill="#2b3a7a"/>
    <!-- 內側左塔 Inner left tower -->
    <rect x="250" y="130" width="60" height="190" fill="url(#wall)"/>
    <polygon points="242,132 280,72 318,132" fill="url(#roof)"/>
    <circle cx="280" cy="200" r="9" fill="#2b3a7a"/>
    <!-- 主樓 Main keep -->
    <rect x="310" y="170" width="180" height="150" fill="url(#wall)"/>
    <path d="M370,254 v-18 a15,15 0 0 1 30,0 v18 z" fill="#2b3a7a"/>
    <path d="M400,254 v-18 a15,15 0 0 1 30,0 v18 z" fill="#2b3a7a"/>
    <path d="M378,320 v-42 a22,22 0 0 1 44,0 v42 z" fill="#24306b"/>
    <polygon points="300,172 400,76 500,172" fill="url(#roof)"/>
    <polygon points="388,78 400,32 412,78" fill="#3f8fe0"/>
    <!-- 旗 Flag -->
    <line x1="400" y1="32" x2="400" y2="8" stroke="#8a8a96" stroke-width="3"/>
    <polygon points="400,8 436,17 400,26" fill="#ff6b8a"/>
    <!-- 內側右塔 Inner right tower -->
    <rect x="490" y="130" width="60" height="190" fill="url(#wall)"/>
    <polygon points="482,132 520,72 558,132" fill="url(#roof)"/>
    <circle cx="520" cy="200" r="9" fill="#2b3a7a"/>
    <!-- 外側右塔 Outer right tower -->
    <rect x="560" y="190" width="50" height="130" fill="url(#wall)"/>
    <polygon points="552,192 585,140 618,192" fill="url(#roof)"/>
    <circle cx="585" cy="230" r="8" fill="#2b3a7a"/>
  </g>

  <!-- 前景灌木 Bushes -->
  <ellipse cx="150" cy="352" rx="60" ry="22" fill="#37a06a"/>
  <ellipse cx="650" cy="352" rx="70" ry="24" fill="#37a06a"/>
</svg>